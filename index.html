<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flow Reader</title>
    <!-- No leading slash so icons resolve correctly under a GitHub Pages base path -->
    <link rel="icon" href="pwa-icon.svg" />
    <link rel="apple-touch-icon" href="pwa-icon.svg" />
    
    <!-- Google Fonts: Merriweather (Serif) and Inter (Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@300;400;700;900&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'app-bg': 'rgb(var(--color-app-bg) / <alpha-value>)',
              'panel-bg': 'rgb(var(--color-panel-bg) / <alpha-value>)',
              'accent-red': 'rgb(var(--color-accent) / <alpha-value>)',
              'text-primary': 'rgb(var(--color-text-primary) / <alpha-value>)',
              'text-secondary': 'rgb(var(--color-text-secondary) / <alpha-value>)',
              'bionic-highlight': 'rgb(var(--color-bionic-highlight) / <alpha-value>)',
              'progress': 'rgb(var(--color-progress) / <alpha-value>)',
            },
            fontFamily: {
              header: ['"Playfair Display"', 'serif'],
              ui: ['"Inter"', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 20px rgba(var(--color-accent), 0.15)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-app-bg: 15 15 16;
        --color-panel-bg: 24 24 27;
        --color-text-primary: 255 255 255;
        --color-text-secondary: 161 161 170;
        --color-accent: 255 71 87;
        --color-bionic-highlight: 255 107 107;
        --color-progress: 255 71 87;
      }
      body {
        background-color: rgb(var(--color-app-bg));
        color: rgb(var(--color-text-primary));
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgb(var(--color-app-bg)); }
      ::-webkit-scrollbar-thumb { background: rgba(var(--color-text-secondary), 0.35); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(var(--color-text-secondary), 0.5); }

      @keyframes idleDriftSlow {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
        50% { transform: translate3d(-16px, 12px, 0) scale(1.05); opacity: 0.9; }
      }

      @keyframes idleDriftWide {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.52; }
        50% { transform: translate3d(22px, -10px, 0) scale(1.04); opacity: 0.68; }
      }

      @keyframes idleFloatFloor {
        0%, 100% { transform: translate3d(-50%, 0, 0) scaleX(1); opacity: 0.22; }
        50% { transform: translate3d(-50%, -6px, 0) scaleX(1.05); opacity: 0.3; }
      }

      @keyframes idleSheenSweep {
        0%, 100% { transform: translate3d(-50%, 0, 0) scale(1); opacity: 0.14; }
        50% { transform: translate3d(-50%, 8px, 0) scale(1.03); opacity: 0.22; }
      }

      .idle-light {
        position: absolute;
        border-radius: 999px;
        filter: blur(72px);
        will-change: transform, opacity;
        transform: translateZ(0);
        mix-blend-mode: screen;
      }

      .idle-light-left {
        left: -8%;
        top: 16%;
        width: min(24rem, 30vw);
        height: min(34rem, 48vw);
        background: radial-gradient(ellipse at center, rgba(255, 182, 164, 0.18) 0%, rgba(255, 122, 92, 0.06) 42%, transparent 76%);
        animation: idleDriftWide 26s ease-in-out infinite;
      }

      .idle-light-center {
        left: 50%;
        top: 16%;
        width: min(62rem, 88vw);
        height: min(28rem, 38vw);
        transform: translate3d(-50%, 0, 0);
        background: radial-gradient(ellipse at center, rgba(255, 198, 180, 0.18) 0%, rgba(255, 136, 108, 0.08) 34%, rgba(255, 136, 108, 0.02) 58%, transparent 78%);
        animation: idleDriftSlow 24s ease-in-out infinite;
      }

      .idle-light-right {
        right: -8%;
        top: 26%;
        width: min(26rem, 32vw);
        height: min(32rem, 44vw);
        background: radial-gradient(ellipse at center, rgba(255, 208, 192, 0.16) 0%, rgba(255, 132, 96, 0.055) 40%, transparent 76%);
        animation: idleDriftWide 30s ease-in-out infinite reverse;
      }

      .idle-light-floor {
        left: 50%;
        bottom: 10%;
        width: min(76rem, 92vw);
        height: min(14rem, 20vw);
        transform: translate3d(-50%, 0, 0);
        background: radial-gradient(ellipse at center, rgba(255, 200, 182, 0.09) 0%, rgba(255, 126, 96, 0.03) 42%, transparent 78%);
        filter: blur(64px);
        opacity: 0.24;
        animation: idleFloatFloor 22s ease-in-out infinite;
      }

      .idle-sheen-strip {
        position: absolute;
        left: 50%;
        top: 2%;
        width: min(42rem, 62vw);
        height: min(26rem, 38vw);
        transform: translate3d(-50%, 0, 0);
        border-radius: 999px;
        background: radial-gradient(ellipse at center, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.04) 34%, transparent 72%);
        filter: blur(56px);
        opacity: 0.16;
        will-change: transform, opacity;
        animation: idleSheenSweep 18s ease-in-out infinite;
      }

      .idle-content-veil {
        background:
          radial-gradient(ellipse at center, rgba(10, 10, 12, 0.74) 0%, rgba(10, 10, 12, 0.56) 28%, rgba(10, 10, 12, 0.2) 58%, transparent 84%);
        filter: blur(24px);
      }

      @media (max-width: 768px) {
        .idle-light {
          filter: blur(54px);
        }

        .idle-light-left {
          left: -18%;
          top: 18%;
          width: 16rem;
          height: 25rem;
          opacity: 0.42;
        }

        .idle-light-center {
          top: 12%;
          width: 34rem;
          height: 24rem;
          background: radial-gradient(ellipse at center, rgba(255, 198, 180, 0.22) 0%, rgba(255, 136, 108, 0.1) 36%, rgba(255, 136, 108, 0.03) 60%, transparent 80%);
        }

        .idle-light-right {
          right: -22%;
          top: 26%;
          width: 17rem;
          height: 24rem;
          opacity: 0.42;
        }

        .idle-light-floor {
          bottom: 14%;
          width: 30rem;
          height: 8rem;
          filter: blur(52px);
          opacity: 0.34;
        }

        .idle-sheen-strip {
          top: 6%;
          width: 24rem;
          height: 16rem;
          filter: blur(42px);
          opacity: 0.24;
        }

        .idle-content-veil {
          background:
            radial-gradient(ellipse at center, rgba(10, 10, 12, 0.66) 0%, rgba(10, 10, 12, 0.46) 30%, rgba(10, 10, 12, 0.14) 62%, transparent 88%);
          filter: blur(18px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .idle-light-left,
        .idle-light-center,
        .idle-light-right,
        .idle-light-floor,
        .idle-sheen-strip {
          animation: none;
        }
      }

      /* Prevent iOS/Android tap flash on interactive elements */
      * { -webkit-tap-highlight-color: transparent; }
    </style>

    <!-- PDF.js for parsing PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Initialize PDF.js worker
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
</head>
  <body class="bg-app-bg text-text-primary font-sans antialiased overflow-x-hidden selection:bg-accent-red selection:text-text-primary">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
